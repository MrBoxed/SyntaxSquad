<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookmark Buzz</title>
    <link rel="stylesheet" href="popup.css">
    <link rel="shortcut icon" href="./img/syntaxSquadLogo.png" type="image/x-icon">
    <script src="popup.js" type="module" defer></script>
</head>

<body>
    <div class="container">
        <!-- <div class="topContainer">
            <!-- <div class="header-content">
                <img src="./img/syntaxSquadLogo.png" id="logo" alt="logo" height="32px" />
                <div id="appName">Bookmark Buzz</div>
            </div> 
        </div> 
        -->

        <div class="task-input">
            <!-- INPUT FIELD -->
            <input type="text" id="taskInput" placeholder="Search for a Bookmark" />
            <!-- ADD TASK BTN -->
            <button class="add-btn">
                <img src="./img/add.png" />
            </button>
        </div>

        <div id="taskCount">Active Bookmarks - 0</div>
        <div class="task-list">
            <!-- Task items will be dynamically added here -->
        </div>
        <!-- Popup for setting alarm time -->
        <div id="alarm-popup" class="popup">
            <div class="popup-content">
                <span class="close-btn" id="close-popup">&times;</span>
                <h2 id="alarm-heading">Set Alarm Time</h2>
                <input type="datetime-local" id="alarm-time-input" />
                <button id="save-alarm-btn">Save</button>
            </div>
        </div>

    </div>
</body>

</html>
